[package]
name = "navidrome-companion"
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-or-later"

[dependencies]
# Native WebView shell (system WebKitGTK/WebView2; no bundled Chromium/Electron)
tauri = { version = "2", features = ["image-png"] }

# Async
tokio = { version = "1", features = ["io-util", "macros", "process", "rt-multi-thread", "time"] }

# HTTP
reqwest = { version = "0.12", features = ["json", "stream", "rustls-tls", "blocking"] }
url = "2"

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.9"

# System & processes
sysinfo = "0.37"
directories = "6"

# Archives
flate2 = "1"
getrandom = "0.3"
tar = "0.4"
zip = "5"

# Utils
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
tempfile = "3"
chrono = "0.4"
regex = "1"
walkdir = "2"

[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2"
webkit2gtk = { version = "2.0", features = ["v2_40"] }
# GTK is used directly to host the service windows: it is the only way to give
# WebKit a WebContext SyncPulse can configure (see src/service_window.rs).
gtk = { version = "0.18", features = ["v3_24"] }
# MPRIS2: the native client registers itself on the session bus so the
# desktop's media controls (Plasma, GNOME, ...) can drive the playback.
zbus = { version = "5", default-features = false, features = ["async-io", "blocking-api"] }

# Subsonic token authentication for Navidrome library rescans
md-5 = "0.10"

[build-dependencies]
tauri-build = { version = "2", features = [] }

# Keep the shipped binary small: SyncPulse is a WebView shell whose own code is
# tiny compared to WebKit, so a bloated binary only costs disk and page-cache
# pressure. Symbol stripping also keeps the RSS low when the loader maps it.
[profile.release]
lto = "thin"
codegen-units = 1
strip = true
